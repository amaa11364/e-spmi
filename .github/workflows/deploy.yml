name: Auto Deploy to CloudPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: SFTP Deploy
        uses: wlixcc/SFTP-Deploy-Action@v1.2.5
        with:
          server: '153.92.5.200'
          username: 'e-spmii'
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 4096
          local_path: './*'
          remote_path: '/home/ikipsiliwangi-e-spmi/htdocs/e-spmi.ikipsiliwangi.ac.id/'
          sftp_only: true    # <--- Tambahkan ini agar tidak minta ssh_private_key
          ssh_private_key: '' # <--- Kosongkan jika hanya pakai password